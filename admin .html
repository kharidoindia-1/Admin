<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Admin – Pyrite Orders</title>
<style>
:root{--bg:#07100d;--em:#0d2b22;--gold:#c9a45c;--g2:#e6c98a;--ink:#f3ecdc;--mut:#b4b8ac}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}[hidden]{display:none!important}
.w{max-width:960px;margin:0 auto;padding:16px}h1{font:600 1.6rem Georgia,serif;margin:0;color:var(--g2)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
input,select,textarea{background:rgba(0,0,0,.4);border:1px solid rgba(201,164,92,.3);color:var(--ink);border-radius:4px;padding:10px;font:inherit;width:100%}
button{background:var(--gold);color:#1a1205;border:0;border-radius:4px;padding:10px 16px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}button.g{background:none;border:1px solid var(--gold);color:var(--g2)}
.box{background:rgba(255,255,255,.04);border:1px solid rgba(201,164,92,.22);border-radius:6px;padding:16px;margin-bottom:12px}
#lg{max-width:360px;margin:12vh auto}#lg form{display:grid;gap:10px;margin-top:14px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.st div{text-align:center;padding:12px 4px}.st b{display:block;font-size:1.4rem;color:var(--g2)}.st small{color:var(--mut)}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tb button{padding:7px 12px;font-size:.85rem}.tb .on{background:var(--gold);color:#1a1205}.tb button:not(.on){background:none;border:1px solid var(--gold);color:var(--g2)}
.r{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.m{color:var(--mut);font-size:.88rem}.pill{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:99px;border:1px solid var(--gold);color:var(--g2);margin-right:6px}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.ed .f{grid-column:1/-1}.er{color:#f0a0a0;font-size:.9rem}a{color:var(--g2)}
@media(max-width:560px){.st{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="lg" class="box"><h1>Admin Login</h1><form id="lf"><input id="em" type="email" placeholder="Admin email" required autocomplete="username"><input id="pw" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign in</button><p class="er" id="le"></p></form></div>
<div id="ap" class="w" hidden><div class="bar"><h1>Pyrite Orders</h1><div><button class="g" id="ex">Export CSV</button> <button class="g" id="lo">Sign out</button></div></div>
<p class="er" id="ae"></p><div class="st box"><div><b id="s1">0</b><small>Total</small></div><div><b id="s2">0</b><small>Pending</small></div><div><b id="s3">0</b><small>Payments to verify</small></div><div><b id="s4">₹0</b><small>Verified revenue</small></div></div>
<input id="q" placeholder="Search by Order ID, name, mobile or city"><div class="tb" id="tb"></div><div id="ls"></div></div>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBIr6Y2y6prLKgd7P857yCnY60eUhIOd8o",authDomain:"kxl-9cd03.firebaseapp.com",projectId:"kxl-9cd03",storageBucket:"kxl-9cd03.firebasestorage.app",messagingSenderId:"617940943718",appId:"1:617940943718:web:9a3f2aa243e544ab12bea7"});var auth=firebase.auth(),db=firebase.firestore(),all=[],flt="all",un=null;
function $(i){return document.getElementById(i)}function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var SL=["pending","confirmed","shipped","delivered","cancelled"],PL=["pending","verified","failed","cod","collected"];
function opts(a,v){return a.map(function(x){return'<option'+(x===v?" selected":"")+'>'+x+'</option>'}).join("")}
$("lf").onsubmit=function(e){e.preventDefault();$("le").textContent="";auth.signInWithEmailAndPassword($("em").value,$("pw").value).catch(function(){$("le").textContent="Wrong email or password."})};
$("lo").onclick=function(){auth.signOut()};
auth.onAuthStateChanged(function(u){$("lg").hidden=!!u;$("ap").hidden=!u;if(un){un();un=null}if(!u)return;$("ae").textContent="";
un=db.collection("orders").orderBy("createdAt","desc").limit(300).onSnapshot(function(s){all=s.docs.map(function(d){return d.data()});draw()},function(e){$("ae").textContent="Cannot read orders. Check that your Firestore rules allow this admin account. ("+e.code+")"})});
function draw(){var q=$("q").value.toLowerCase(),n=all.length,pe=0,pv=0,rv=0;
all.forEach(function(o){if(o.status==="pending")pe++;if(o.mode==="online"&&o.payment==="pending"&&o.status!=="cancelled")pv++;if(o.payment==="verified"||o.payment==="collected")rv+=o.amount||0});
$("s1").textContent=n;$("s2").textContent=pe;$("s3").textContent=pv;$("s4").textContent="₹"+rv;
$("tb").innerHTML=["all"].concat(SL).map(function(x){return'<button data-f="'+x+'" class="'+(x===flt?"on":"")+'">'+x+'</button>'}).join("");
var l=all.filter(function(o){return(flt==="all"||o.status===flt)&&(!q||[o.id,o.name,o.phone,o.city].join(" ").toLowerCase().indexOf(q)>-1)});
$("ls").innerHTML=l.length?l.map(function(o){var d=o.createdAt&&o.createdAt.toDate?o.createdAt.toDate().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"just now";
return'<div class="box"><div class="r"><b>'+esc(o.id)+'</b><span class="m">'+d+'</span></div><div>'+esc(o.product)+' × '+esc(o.qty)+' — <b>₹'+esc(o.amount)+'</b> ('+(o.mode==="online"?"UPI/Online":"COD")+')</div>'+
'<div class="m">'+esc(o.name)+' · <a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a> · <a target="_blank" rel="noopener" href="https://wa.me/91'+esc(o.phone)+'">WhatsApp</a><br>'+esc(o.address)+', '+esc(o.city)+', '+esc(o.state)+' - '+esc(o.pincode)+(o.utr?'<br>UTR: <b>'+esc(o.utr)+'</b>':'')+'</div>'+
'<div class="ed"><select data-k="st">'+opts(SL,o.status)+'</select><select data-k="pm">'+opts(PL,o.payment)+'</select><input class="f" data-k="nt" placeholder="Note for customer (courier, tracking no.)" value="'+esc(o.note||"")+'" maxlength="200"><button class="f" data-save="'+esc(o.id)+'">Save</button></div></div>'}).join(""):'<p class="m">No orders found.</p>'}
$("q").oninput=draw;
document.addEventListener("click",function(e){var t=e.target;if(t.dataset.f){flt=t.dataset.f;draw()}
if(t.dataset.save){var b=t.closest(".box"),id=t.dataset.save;t.disabled=true;db.collection("orders").doc(id).update({status:b.querySelector('[data-k=st]').value,payment:b.querySelector('[data-k=pm]').value,note:b.querySelector('[data-k=nt]').value.trim(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){t.textContent="Saved ✓";setTimeout(function(){t.textContent="Save";t.disabled=false},1200)},function(){t.textContent="Failed — check rules";t.disabled=false})}});
$("ex").onclick=function(){var c=function(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'},k=["id","qty","mode","amount","name","phone","address","city","state","pincode","utr","status","payment","note"];
var r=[k.join(",")].concat(all.map(function(o){return k.map(function(x){return c(o[x])}).join(",")}));var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.join("\n")],{type:"text/csv"}));a.download="orders.csv";a.click()};
</script></body></html>
